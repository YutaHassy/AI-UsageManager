[pytest]
# GUI を伴わない中核ロジックの回帰テストだけをここに置く。
testpaths = tests

# services/ models/ (リポジトリ直下の原本) を import パスに含める。
# tests/test_core.py 自身も sys.path を調整するが、`pytest` を
# どのカレントディレクトリから起動しても解決できるよう、ここでも
# 明示しておく。vscode-extension/backend/ 配下にはビルド時生成の
# コピーが存在するため、そちらを誤って import しないこと
# (tests/test_core.py 冒頭の sys.path 調整とアサーションを参照)。
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*
